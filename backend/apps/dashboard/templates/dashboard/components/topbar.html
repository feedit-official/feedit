{% load static %}
{% with url_name=request.resolver_match.url_name %}
<div class="top">
  <div class="topIn">
    <a class="logo" href="{% url 'dashboard:dashboard' %}">
      <img src="{% static 'dashboard/img/feedit-logo.png' %}" alt="FEEDiT" class="logo-mark" width="24" height="24">
      <b>FEEDiT</b> <span>ADMIN</span>
    </a>
    
    <div class="tabs">
      <a href="{% url 'dashboard:platform_status' %}" class="btn {% if url_name == 'platform_status' or url_name == 'collection_targets' or url_name == 'run_crawl' or url_name == 'collection_runs' or url_name == 'crawl_rules' or url_name == 'robots_check' %}on{% endif %}">수집</a>
      
      <a href="{% url 'dashboard:raw_documents' %}" class="btn {% if url_name == 'raw_documents' %}on{% endif %}">원본데이터</a>
      
      <a href="{% url 'dashboard:pipeline_overview' %}" class="btn {% if url_name == 'pipeline_overview' or url_name == 'normalized_products' or url_name == 'normalization_failures' or url_name == 'data_quality' or url_name == 'normalized_musinsa' or url_name == 'normalized_zigzag' or url_name == 'normalized_ably' or url_name == 'normalized_kream' or url_name == 'normalized_musinsa_used' or url_name == 'normalized_youtube' or url_name == 'normalized_naver' or url_name == 'text_youtube' or url_name == 'text_musinsa' or url_name == 'text_zigzag' or url_name == 'text_ably' or url_name == 'text_naver' %}on{% endif %}">정규화데이터</a>
      
      <a href="{% url 'dashboard:trend_metrics' %}" class="btn {% if url_name == 'trend_metrics' or url_name == 'term_metrics' or url_name == 'product_metrics' or url_name == 'product_snapshot' %}on{% endif %}">데이터분석</a>
      
      <a href="{% url 'dashboard:service_users' %}" class="btn {% if url_name == 'feedback_list' or url_name == 'report_list' or url_name == 'service_users' or url_name == 'service_events' or url_name == 'service_votes' or url_name == 'service_comments' %}on{% endif %}">서비스</a>

      <a href="{% url 'dashboard:database_overview' %}" class="btn {% if url_name == 'database_overview' or url_name == 'database_query' %}on{% endif %}">데이터베이스</a>

      <a href="{% url 'dashboard:system_status' %}" class="btn {% if url_name == 'system_status' or url_name == 'jobs' or url_name == 'system_api' or url_name == 'system_aws' or url_name == 'system_celery' %}on{% endif %}">시스템</a>
      
      <a href="{% url 'dashboard:dictionary_overview' %}" class="btn {% if url_name == 'dictionary_overview' or url_name == 'dictionary_terms' or url_name == 'dictionary_term_detail' or url_name == 'dictionary_candidates' or url_name == 'dictionary_candidate_detail' or url_name == 'dictionary_candidate_review' or url_name == 'dictionary_quality' or url_name == 'brand_sources' or url_name == 'brand_search' or url_name == 'brands' or url_name == 'categories' or url_name == 'products' %}on{% endif %}">사전</a>
    </div>
    
    <div class="live">
      SYSTEM LIVE <div class="dot on"></div>
      {% if request.user.is_authenticated %}
      <span style="margin-left: 15px; color: var(--tx2); text-transform: none;">{{ request.user.username }} 님</span>
      <a href="{% url 'dashboard:logout' %}" style="margin-left: 10px; color: var(--tx2); text-decoration: none;">로그아웃</a>
      {% endif %}
    </div>
  </div>
</div>
{% endwith %}

<style>
  /* 로고: 마크와 글자의 시각적 중심을 맞춘다.
     마크는 정사각 이미지라 line-height 영향을 받지 않게 block으로 둔다. */
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: inherit;
    flex-shrink: 0;
    line-height: 1;
  }
  .logo-mark {
    width: 24px;
    height: 24px;
    display: block;
    flex-shrink: 0;
    object-fit: contain;
  }
  .logo b {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1;
    display: block;
  }
  .logo span {
    font-family: var(--num);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: .16em;
    color: var(--tx3);
    line-height: 1;
    display: block;
    padding-left: 9px;
    margin-left: 1px;
    border-left: 1px solid var(--line);
  }
  .logo:hover b { opacity: .65; }
  .tabs { display: flex; gap: 3px; margin-left: 14px; }
  .tabs .btn { padding: 8px 15px; border-radius: 9px; font-size: 13px; color: var(--tx2); transition: .25s var(--ease); text-decoration: none; border: none; background: transparent; }
  .tabs .btn:hover { background: rgba(10,10,10,.05); }
  .tabs .btn.on { background: var(--ink); color: #f1efea; }
</style>
