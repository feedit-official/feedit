# EC2 /etc/nginx/sites-enabled/feedit 기준 운영 설정.
# 인증서 경로는 certbot certonly로 발급한 feedit-official.duckdns.org 기준이다.

limit_req_zone $binary_remote_addr zone=feedit_admin_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=feedit_admin_page:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=feedit_admin_conn:10m;

server {
    listen 80;

    server_name 15.164.151.62 feedit-official.duckdns.org;

    # 기본 Django Admin은 커스텀 OTP를 우회하므로 공개하지 않는다.
    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }

    # 관리자 화면만 HTTPS로 보낸다. 기존 API·챗봇의 HTTP 경로는 Vercel 설정을
    # HTTPS로 전환하기 전까지 그대로 유지한다.
    location /admin-dashboard/ {
        return 308 https://feedit-official.duckdns.org$request_uri;
    }

    location /v1/ {
        # 사진 질문 · 가상 피팅은 본문에 data URL 사진이 실린다 (2026-10-02).
        # 기본값 1m 이면 사진 한두 장에 413 으로 끊긴다. 버셀 함수 한도(4.5MB)보다 넉넉히.
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-FEEDiT-Token    $http_x_feedit_token;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /static/ {
        alias /home/ubuntu/SKN31-FINAL-4Team/backend/staticfiles/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name feedit-official.duckdns.org;

    # 기본 Django Admin은 커스텀 OTP를 우회하므로 공개하지 않는다.
    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }

    ssl_certificate /etc/letsencrypt/live/feedit-official.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feedit-official.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /v1/ {
        # 사진 질문 · 가상 피팅은 본문에 data URL 사진이 실린다 (2026-10-02).
        # 기본값 1m 이면 사진 한두 장에 413 으로 끊긴다. 버셀 함수 한도(4.5MB)보다 넉넉히.
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-FEEDiT-Token    $http_x_feedit_token;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 인증 요청은 일반 관리자 페이지보다 강하게 제한한다.
    location ~ ^/admin-dashboard/(login|otp/setup|otp/verify)/$ {
        limit_req zone=feedit_admin_auth burst=5 nodelay;
        limit_conn feedit_admin_conn 5;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /admin-dashboard/ {
        limit_req zone=feedit_admin_page burst=30 nodelay;
        limit_conn feedit_admin_conn 10;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # 기존 /static/ alias는 유령 레포를 향한다. 관리자 정적 파일만 새 API의
    # WhiteNoise로 먼저 보내 기존 경로와 충돌하지 않게 한다.
    location /static/dashboard/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
    }

    location /static/ {
        alias /home/ubuntu/SKN31-FINAL-4Team/backend/staticfiles/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
