# FEEDiT 읽기 전용 API — 이미 돌고 있는 nginx 에 이 블록 하나만 더합니다.
#
# 두는 곳: 챗봇 /v1/ 블록이 들어 있는 그 server { } 안.
#   보통 /etc/nginx/sites-available/<이름> 또는 /etc/nginx/conf.d/<이름>.conf
#
# 넣은 뒤:
#   sudo nginx -t          ← 문법 검사. 통과해야 합니다
#   sudo systemctl reload nginx
#
# ★ 여는 길은 /api/ 하나뿐입니다.
#   Django 는 127.0.0.1:8000 에만 묶여 있어 인터넷에서 직접은 못 닿습니다.
#   /admin/ 은 **열지 않습니다** — 관리자 화면을 인터넷에 세우지 않기 위해서입니다.
#   관리자로 들어갈 일이 있으면 SSH 포트 포워딩으로 잠깐 씁니다:
#       ssh -L 8000:127.0.0.1:8000 <서버>   그리고 http://127.0.0.1:8000/admin/

location /api/ {
    # ★ 8000 이 아니라 8001 이다.
    #   이 서버의 8000 은 DB 팀 gunicorn 이 이미 쓰고 있다(호스트에서 직접 돈다).
    #   그래서 컨테이너 바깥 포트를 .env 의 API_PORT=8001 로 옮겼다.
    #   API_PORT 를 바꾸면 여기도 같이 바꿔야 한다.
    proxy_pass http://127.0.0.1:8001;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ★ 토큰 머리글을 그대로 넘겨야 합니다.
    #   nginx 는 밑줄(_) 이 든 머리글을 기본으로 버리는데, 우리 것은
    #   X-FEEDiT-Token 이라 하이픈이므로 그냥 지나갑니다. 명시해 두면
    #   나중에 이름이 바뀌어도 여기만 보면 됩니다.
    proxy_set_header X-FEEDiT-Token    $http_x_feedit_token;

    # 챗봇(/v1/)과 달리 SSE 가 아닙니다 — 버퍼링을 끌 이유가 없습니다.
    # 사전이 크니(브랜드 2,775행) 시간만 넉넉히 둡니다.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
