# FEEDiT 챗봇 — 이미 돌고 있는 nginx 에 이 블록 하나만 더합니다.
#
# 두는 곳: 그 도메인을 맡고 있는 server { } 안.
#   보통 /etc/nginx/sites-available/<이름> 또는 /etc/nginx/conf.d/<이름>.conf
#
# 넣은 뒤:
#   sudo nginx -t          ← 문법 검사. 통과해야 합니다
#   sudo systemctl reload nginx
#
# ★ 여는 길은 /v1/ 하나뿐입니다. 챗봇 서버는 그 아래만 응답합니다.
#   챗봇은 127.0.0.1:8770 에만 묶여 있어 인터넷에서 직접은 못 닿습니다.

location /v1/ {
    proxy_pass http://127.0.0.1:8770;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ★ 여기가 중요합니다 — 챗봇 답변은 SSE(글자 흘리기)입니다.
    #   버퍼링을 끄지 않으면 nginx 가 다 모았다가 한 번에 보내서
    #   '생각하는 중' 느낌이 사라지고, 긴 답은 시간 초과에 걸립니다.
    proxy_buffering          off;
    proxy_cache              off;
    chunked_transfer_encoding off;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
