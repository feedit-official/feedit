services:
  ssm-tunnel:
    build:
      context: .
      dockerfile: ssm.Dockerfile

    container_name: feedit-ssm-tunnel

    env_file:
      - ../.env

    ports:
      - "5433:5433"

    command: >
      sh -c "
      socat TCP-LISTEN:5433,fork,reuseaddr TCP:127.0.0.1:15433 &
      aws ssm start-session
      --target $$EC2_INSTANCE_ID
      --document-name AWS-StartPortForwardingSessionToRemoteHost
      --parameters host=$$RDS_HOST,portNumber=$$RDS_PORT,localPortNumber=15433
      --region $$AWS_REGION
      "

    healthcheck:
      test: ["CMD-SHELL", "socat - TCP:127.0.0.1:15433,connect-timeout=2 </dev/null >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

    restart: unless-stopped


  redis:
    image: redis:7-alpine
    container_name: feedit-redis

    ports:
      - "6379:6379"

    restart: unless-stopped


  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile

    container_name: feedit-web

    env_file:
      - ../.env

    environment:
      DB_HOST: ssm-tunnel
      DB_PORT: 5433
      REDIS_HOST: redis
      REDIS_PORT: 6379

    ports:
      - "8000:8000"

    volumes:
      - ../backend:/app

    depends_on:
      ssm-tunnel:
        condition: service_healthy
      redis:
        condition: service_started

    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000
      "

    restart: unless-stopped

  # ── 챗봇 (feedit-chat) ────────────────────────────────────
  #   프론트 dev 서버가 /api/v1/… 를 여기로 프록시한다 (frontend/vite.config.js).
  #
  #   ★ 크롤러 저장소가 있어야 뜬다. .env 에 이 줄이 필요하다:
  #       FEEDIT_CRAWLER_DIR=/절대/경로/feedit-crawler
  #     없으면 컨테이너가 "무엇이 없는지" 를 찍고 멈춘다 — 조용히 죽지 않는다.
  #     크롤러가 없는 팀원은 이 서비스만 빼고 쓰면 된다:
  #       docker compose up ssm-tunnel redis web
  chatbot:
    build:
      context: ..
      dockerfile: docker/chat.Dockerfile

    container_name: feedit-chatbot

    env_file:
      - ../.env

    environment:
      # 컨테이너 안에서 밖으로 열되(0.0.0.0), 호스트에서는 127.0.0.1 로만 묶는다.
      FEEDIT_CHAT_HOST: 0.0.0.0
      FEEDIT_CHAT_PORT: 8770
      FEEDIT_CRAWLER_DIR: /crawler

    ports:
      # ★ 127.0.0.1 을 앞에 붙인다. 이걸 빼면 인증 없는 서버가
      #   같은 와이파이의 아무에게나 열린다.
      - "127.0.0.1:8770:8770"

    volumes:
      - ../ChatBot:/app                                    # 코드 — 고치면 바로 반영
      - ${FEEDIT_CRAWLER_DIR:-../../feedit-crawler}:/crawler:ro   # 지표·사전 — 읽기만

    restart: unless-stopped
