# 챗봇만 올린다 — Django·RDS·SSM 없이.
#
# ══════════════════════════════════════════════════════════════
#  왜 따로 두나
# ══════════════════════════════════════════════════════════════
# 챗봇은 RDS 를 안 본다. 크롤러 SQLite 만 읽는다.
# 그래서 Django·ssm-tunnel·redis 가 하나도 필요 없다.
# compose.prod.yml 을 쓰면 그 셋까지 같이 세워야 하는데,
# 챗봇 하나 띄우려고 서버 전체를 구축할 이유가 없다.
#
# ── 두 가지 모드 ──────────────────────────────────────────────
#
#  ① 이미 앞단(nginx 등)이 있는 서버 — **기본값**
#     챗봇만 뜨고 127.0.0.1:8770 에만 열린다. 앞단이 /v1/ 을 넘겨준다.
#     설정 조각: docker/nginx-feedit-chat.conf
#
#       docker compose --env-file .env -f docker/compose.chat.yml up -d --build
#
#  ② 앞단이 없는 서버 — Caddy 가 HTTPS 까지 맡는다
#     80·443 이 비어 있어야 한다.
#
#       docker compose --env-file .env -f docker/compose.chat.yml \
#         --profile standalone up -d --build
#
# 서버 .env 에 필요한 것 (다섯 줄이면 된다):
#   OPENAI_API_KEY=sk-...
#   FEEDIT_CHAT_TOKEN=<버셀 CHAT_BACKEND_TOKEN 과 같은 값>
#   FEEDIT_CHAT_RATE_PER_MIN=20
#   CHAT_DOMAIN=feedit-official.duckdns.org
#   CHAT_DATA_DIR=/opt/feedit-chat-data
#   (선택) CHAT_DNS=169.254.169.253   ← EC2 기본값. 다른 환경이면 1.1.1.1

services:
  chatbot:
    build:
      context: ..
      dockerfile: docker/chat.Dockerfile

    container_name: feedit-chatbot

    env_file:
      - ../.env

    environment:
      FEEDIT_CHAT_HOST: 0.0.0.0
      FEEDIT_CHAT_PORT: 8770
      FEEDIT_CRAWLER_DIR: /crawler
      FEEDIT_EXTRACTOR_DIR: /tools

    volumes:
      # tools_make_bundle.sh 로 만든 묶음을 푼 곳. 읽기만 한다.
      - ${CHAT_DATA_DIR:-/opt/feedit-chat-data}/crawler:/crawler:ro
      - ${CHAT_DATA_DIR:-/opt/feedit-chat-data}/tools:/tools:ro


    # ★ DNS 를 명시한다.
    #   Ubuntu 호스트의 /etc/resolv.conf 는 systemd-resolved 스텁(127.0.0.53)을
    #   가리킨다. Docker 가 그걸 그대로 컨테이너에 넣으면, 컨테이너 안에서
    #   127.0.0.53 은 **자기 자신의 루프백**이라 아무도 안 듣는다:
    #       lookup … on 127.0.0.53:53: connection refused
    #   (2026-09-08 서버에서 Caddy 가 Let's Encrypt 주소를 못 찾아 이 오류를 냈다)
    #
    #   169.254.169.253 은 AWS VPC 리졸버다. EC2 안에서는 항상 닿는다.
    #   다른 환경이면 .env 의 CHAT_DNS 로 바꾼다 (예: 1.1.1.1).
    dns:
      - ${CHAT_DNS:-169.254.169.253}

    # ★ 127.0.0.1 에만 묶는다. 앞단(nginx·Caddy)은 여기로 넘기고,
    #   인터넷에서는 직접 못 닿는다 — 인증이 아직 없기 때문이다.
    #   앞부분 127.0.0.1 을 빼면 인증 없는 서버가 그대로 열린다.
    ports:
      - "127.0.0.1:8770:8770"

    restart: unless-stopped

  caddy:
    # ★ 앞단이 없는 서버에서만 띄운다: --profile standalone
    #   앞단이 이미 80·443 을 쓰고 있으면 이 서비스는 뜨지 않는다
    #   ("address already in use" 로 죽는 대신 아예 안 뜬다).
    profiles: ["standalone"]

    image: caddy:2-alpine
    container_name: feedit-chat-caddy

    environment:
      CHAT_DOMAIN: ${CHAT_DOMAIN:?CHAT_DOMAIN 을 .env 에 넣어 주세요}

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile.chat:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # 인증서가 여기 산다. 지우면 재발급한다.
      - caddy_config:/config
      - caddy_logs:/var/log/caddy


    # ★ DNS 를 명시한다.
    #   Ubuntu 호스트의 /etc/resolv.conf 는 systemd-resolved 스텁(127.0.0.53)을
    #   가리킨다. Docker 가 그걸 그대로 컨테이너에 넣으면, 컨테이너 안에서
    #   127.0.0.53 은 **자기 자신의 루프백**이라 아무도 안 듣는다:
    #       lookup … on 127.0.0.53:53: connection refused
    #   (2026-09-08 서버에서 Caddy 가 Let's Encrypt 주소를 못 찾아 이 오류를 냈다)
    #
    #   169.254.169.253 은 AWS VPC 리졸버다. EC2 안에서는 항상 닿는다.
    #   다른 환경이면 .env 의 CHAT_DNS 로 바꾼다 (예: 1.1.1.1).
    dns:
      - ${CHAT_DNS:-169.254.169.253}

    depends_on:
      - chatbot

    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
