# Django API + Redis + Celery worker/beat — SSM 없이 RDS 직결.
#
# ══════════════════════════════════════════════════════════════
#  왜 굴이 필요 없나
# ══════════════════════════════════════════════════════════════
# docker/ssm.Dockerfile 이 쓰는 명령이 답이다:
#
#   aws ssm start-session --target $EC2_INSTANCE_ID \
#     --document-name AWS-StartPortForwardingSessionToRemoteHost \
#     --parameters host=$RDS_HOST,portNumber=$RDS_PORT
#
# `ToRemoteHost` 는 **그 EC2 를 발판 삼아** RDS 로 넘어가는 방식이다.
# 즉 그 EC2 는 이미 RDS 에 닿고 있다. 굴은 VPC 밖에 있는 맥이 그 EC2 의
# 네트워크 위치를 빌리려고 존재할 뿐이다.
#
# 그래서 **이 컨테이너를 그 EC2 안에서 돌리면** DB_HOST 를 RDS 주소로
# 바꾸는 것만으로 끝난다. RDS 를 인터넷에 열 필요도 없다.
#
#   [지금]   맥 → SSM 굴 → EC2 → RDS          굴이 끊기면 전부 멈춤
#   [바꾼뒤] 브라우저 → 버셀 함수 → 이 컨테이너 → RDS
#
# ══════════════════════════════════════════════════════════════
#  compose.prod.yml 과 무엇이 다른가
# ══════════════════════════════════════════════════════════════
#   ssm-tunnel   없앴다  — 위 이유
#   redis        포함 — Celery worker/beat의 큐를 담당한다
#   caddy        없앴다  — 챗봇이 쓰는 앞단(nginx)이 이미 80·443 을 쥐고 있다.
#                          여기서 또 띄우면 "address already in use" 로 죽는다.
#                          대신 docker/nginx-feedit-api.conf 를 그 nginx 에 넣는다.
#   chatbot      없앴다  — compose.chat.yml 이 따로 맡는다. 건드리지 않는다.
#   이미지       api.Dockerfile (torch·chromium 없는 슬림)
#
# ══════════════════════════════════════════════════════════════
#  띄우기
# ══════════════════════════════════════════════════════════════
#   docker compose --env-file .env -f docker/compose.api.yml up -d --build
#
#  서버 .env 에 있어야 할 것:
#    DJANGO_SECRET_KEY=...
#    DB_NAME=feedit
#    DB_USER=feedit_admin
#    DB_PASSWORD=...
#    DB_HOST=feedit-db.cncws8gyqmnk.ap-northeast-2.rds.amazonaws.com   ← 굴이 아니다
#    DB_PORT=5432
#    FEEDIT_API_TOKEN=<버셀 BACKEND_API_TOKEN 과 같은 값>
#
#  ★ FEEDIT_API_TOKEN 을 비워 두면 /api/ 가 누구에게나 열린다.
#    사전(브랜드 2,775행)과 상품이 그대로 긁힌다. 반드시 넣을 것.

# ★ 프로젝트 이름을 따로 준다.
#   안 주면 compose 는 폴더 이름(feedit)을 프로젝트로 삼는다. 그러면 챗봇
#   (compose.chat.yml)과 **같은 프로젝트**가 되어, 이 파일을 올릴 때
#   "Found orphan containers ([feedit-chatbot ...])" 경고가 뜨고
#   **--remove-orphans 를 붙이면 챗봇이 지워진다.**
#   이름을 갈라 두면 둘이 서로를 모른다.
name: feedit-api

services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    # ★ 2026-09-20 — 이미지 이름을 고정해 celery-worker · celery-beat 가 같은 이미지를 쓴다
    #   (따로 무거운 이미지를 만들지 않는다 — 예전 web.Dockerfile 은 torch·CUDA 까지 깔다가 디스크가 찼다)
    image: feedit-api:latest

    container_name: feedit-api

    env_file:
      - ../.env

    environment:
      DJANGO_DEBUG: "False"
      # ★ 앞단(nginx)이 있을 때만 켠다. 앞단 없이 켜면 머리글을 위조당한다.
      DJANGO_BEHIND_PROXY: "true"
      # ★ .env 값을 쓴다. 여기에 주소를 박아 두면 env_file 값을 덮어써서
      #   버셀 주소를 .env 에 넣어도 로그인 POST 가 CSRF 403 으로 막힌다(2026-09-17).
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-https://feedit-official.duckdns.org}"

    # ★ 127.0.0.1 에만 묶는다. 앞단 nginx 가 여기로 넘기고,
    #   인터넷에서는 직접 못 닿는다. 앞의 127.0.0.1 을 빼면
    #   토큰 검사 전에 포트 자체가 열려 버린다.
    #
    # ★ 바깥 포트는 바꿀 수 있게 둔다.
    #   8000 은 흔한 번호라 이미 누가 쓰고 있을 수 있다(예전 feedit-web
    #   컨테이너가 남아 있거나, 호스트에서 뭔가 돌거나).
    #   그때는 .env 에 API_PORT=8001 한 줄만 넣으면 된다.
    #   ⚠ 바꾸면 nginx 의 proxy_pass 포트도 같이 바꿔야 한다.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

    # ★ migrate 를 여기서 돌리지 않는다.
    #   API는 사용자 데이터 읽기/쓰기를 한다. 스키마 변경은 별도로 검토한다.
    #   여기서 migrate 를 걸면 배포할 때마다 운영 DB 스키마를 건드리게 된다.
    #   (compose.prod.yml 은 그 하나가 전부인 서버라 migrate 를 했다.)
    #   collectstatic 은 /admin/ 화면 때문에 필요하다 — whitenoise 가 준다.
    #  ⚠ 들여쓰기를 건드리지 말 것.
    #    YAML 접힘 블록(>)은 **더 깊게 들여쓴 줄의 줄바꿈을 남긴다.**
    #    예전에 이렇게 썼다가:
    #        gunicorn config.wsgi:application
    #          --bind 0.0.0.0:8000        ← 여기만 두 칸 더 들어가 있었다
    #    `--bind ...` 가 gunicorn 인자가 아니라 **다음 명령 줄**이 됐다.
    #    gunicorn 은 인자 없이 떠서 기본값 127.0.0.1:8000 · 워커 1개로 돌았고,
    #    컨테이너 안 루프백이라 도커 포트 포워딩이 닿지 못해
    #    바깥에서는 "Connection reset by peer" 만 났다.
    #    (2026-09-09 실측 로그: "Listening at: http://127.0.0.1:8000")
    #    아래는 목록 형태 + 같은 깊이라 한 줄로 접힌다.
    command:
      - sh
      - -c
      - >
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers 3
        --timeout 60
        --access-logfile -
        --error-logfile -

    # ★ DNS 를 명시한다 — compose.chat.yml 과 같은 이유.
    #   Ubuntu 호스트의 /etc/resolv.conf 는 systemd-resolved 스텁(127.0.0.53)을
    #   가리키는데, 컨테이너 안에서 그건 자기 루프백이라 아무도 안 듣는다.
    #   RDS 주소를 못 찾으면 여기서 막힌다.
    #   169.254.169.253 은 AWS VPC 리졸버다. EC2 안에서는 항상 닿는다.
    dns:
      - ${CHAT_DNS:-169.254.169.253}

    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════
  #  ★ 2026-09-20 텍스트 신호 자동화 — redis + celery-worker + celery-beat
  # ══════════════════════════════════════════════════════════════
  #  매일 04:10  유튜브 댓글 수집 → 커머스 리뷰 동기화 → LLM(OpenAI API) 분석 → 지표 적재
  #  매일 10:00  알림(가격 하락 · 용어 등재),  일 18:00 주간 리포트 알림
  #  · 모두 API 이미지(feedit-api:latest) 그대로 쓴다. GPU · CUDA · OCR · Playwright 없음.
  #  · 크롤 대상 실행(1분마다)은 크롤러 서버 몫이라 여기서는 끈다(CELERY_CRAWL_DISPATCH=0).
  #  · migrate 는 여기서도 돌리지 않는다 — 표는 사람이 확인하고 한 번만 migrate 한다.
  redis:
    image: redis:7-alpine
    container_name: feedit-redis
    # 큐 전용 — 디스크에 저장하지 않고 메모리도 작게 묶는다
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped

  celery-worker:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    image: feedit-api:latest
    container_name: feedit-celery-worker
    env_file:
      - ../.env
    environment: &celery_env
      DJANGO_DEBUG: "False"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_CRAWL_DISPATCH: "0"
      # 하루 LLM 분석 문서 수 상한 — 0(무제한)이면 첫날 밀린 문서를 한꺼번에 돌려 비용이 튄다.
      # 늘리려면 .env 에 FEEDIT_TEXT_DAILY_ANALYSIS_LIMIT=숫자 를 넣는다.
      FEEDIT_TEXT_DAILY_ANALYSIS_LIMIT: "${FEEDIT_TEXT_DAILY_ANALYSIS_LIMIT:-300}"
    depends_on:
      - redis
    # analysis(텍스트 신호) · default(알림) 큐만 받는다. 작은 서버라 한 번에 하나씩.
    command:
      - sh
      - -c
      - >
        celery -A config worker
        --loglevel=INFO
        --queues=default,analysis
        --concurrency=1
        --max-tasks-per-child=20
    dns:
      - ${CHAT_DNS:-169.254.169.253}
    restart: unless-stopped

  celery-beat:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    image: feedit-api:latest
    container_name: feedit-celery-beat
    env_file:
      - ../.env
    environment: *celery_env
    depends_on:
      - redis
    # 스케줄 파일은 컨테이너 안 /tmp 에 둔다 (앱 폴더를 더럽히지 않는다)
    command:
      - sh
      - -c
      - >
        celery -A config beat
        --loglevel=INFO
        --schedule=/tmp/celerybeat-schedule
    dns:
      - ${CHAT_DNS:-169.254.169.253}
    restart: unless-stopped
