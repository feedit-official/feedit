# FEEDiT 관리자 대시보드 프록시 예시
#
# 이 파일을 그대로 sites-enabled에 두는 것이 아니라, 아래 두 구역을 현재
# feedit-official.duckdns.org server 설정의 알맞은 위치에 합친다.
# 적용 전에는 반드시 `sudo nginx -t`, 적용은 `sudo systemctl reload nginx`.
# reload는 기존 사용자 연결을 끊지 않는다.

# ── 1) nginx.conf의 http { } 안에 한 번만 ───────────────────
# 로그인/OTP는 IP당 분당 10회, 일반 관리자 화면은 초당 10회까지 허용한다.
# 애플리케이션도 계정별 5회 실패 제한을 별도로 적용한다.
limit_req_zone $binary_remote_addr zone=feedit_admin_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=feedit_admin_page:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=feedit_admin_conn:10m;

# ── 2) HTTPS server { } 안에 ─────────────────────────────────
# EC2에서는 현재 Docker의 내부 8000이 호스트 127.0.0.1:8001로 연결된다.
# 실제 `docker ps`와 `nginx -T` 결과가 다르면 확인한 호스트 포트로 바꾼다.

location ~ ^/admin-dashboard/(login|otp/setup|otp/verify)/$ {
    limit_req zone=feedit_admin_auth burst=5 nodelay;
    limit_conn feedit_admin_conn 5;
    client_max_body_size 64k;

    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location /admin-dashboard/ {
    limit_req zone=feedit_admin_page burst=30 nodelay;
    limit_conn feedit_admin_conn 10;
    client_max_body_size 256k;

    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
